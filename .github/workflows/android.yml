name: Android CI

on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore: '**.md'
  pull_request:
    branches: main
    paths-ignore: '**.md'

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Check out
      uses: actions/checkout@v7

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    # Caches the wrapper distribution and the dependency cache between runs;
    # without it every macOS job resolved AGP and JUnit from scratch.
    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v6

    # rust-toolchain.toml pins the channel and the Android targets, but it lives
    # in the crate directory, so the version is repeated here for the action.
    # rust-src is required by the native build (FGP_BUILD_STD).
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: 1.98.1
        components: rustfmt, clippy, rust-src
        targets: aarch64-linux-android,armv7-linux-androideabi

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src/main/native/rust -> target

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Lint the module scripts
      run: |
        command -v shellcheck >/dev/null 2>&1 || brew install shellcheck
        shellcheck -x -S warning module/*.sh

    # Cheap host-compiled checks first: the ABI layout assertions and the
    # config parser, so a broken port fails in seconds instead of after a full
    # NDK build.
    - name: Test the native module
      working-directory: app/src/main/native/rust
      run: |
        cargo fmt --check
        cargo clippy --all-targets --locked -- -D warnings
        cargo test --locked

    # Host clippy cannot see the cfg(target_os = "android") modules (module.rs,
    # hook.rs, companion.rs, setfield.rs), so a warning or error there used to
    # reach a release build unnoticed.
    - name: Lint the Android-only native code
      working-directory: app/src/main/native/rust
      run: |
        cargo clippy --target aarch64-linux-android --all-targets --locked -- -D warnings
        cargo clippy --target armv7-linux-androideabi --all-targets --locked -- -D warnings

    # The zip is built from module/module.prop, so label it before Gradle runs;
    # labelling it afterwards only changed the loose files, not the artifact.
    - name: Label CI version when not a final release code
      run: |
        VERCODE=$(perl -n -e "print \$1 if /^versionCode=(.*)/" module/module.prop)
        if [ "$(echo $VERCODE | grep -o '.$')" -eq 1 ]; then
          perl -pi -e "s/^version=(.*)/version=\$1($VERCODE)-CI #${{ github.run_number }}/" module/module.prop
        fi

    # One Gradle invocation: lint, unit tests and the release build share the
    # configuration phase and the daemon. assembleRelease's finalizers still run
    # copyFiles/verifyDex/zip afterwards.
    - name: Lint, test and build with Gradle
      run: ./gradlew --warning-mode all lintRelease testDebugUnitTest assembleRelease

    - name: Verify the module zip
      run: |
        unzip -l out/GPhotosUnlimited.zip
        for f in module.prop classes.dex zygisk/arm64-v8a.so zygisk/armeabi-v7a.so \
                 META-INF/com/google/android/update-binary; do
          unzip -Z1 out/GPhotosUnlimited.zip | grep -qx "$f" || { echo "missing $f"; exit 1; }
        done

    - name: Upload CI module zip as artifact zip
      uses: actions/upload-artifact@v7
      with:
        name: GPhotosUnlimited-CI_#${{ github.run_number }}
        path: out/GPhotosUnlimited.zip
        compression-level: 9
