name: Android CI

on:
  workflow_dispatch:
  push:
    branches: main
    paths-ignore: '**.md'
  pull_request:
    branches: main
    paths-ignore: '**.md'

jobs:
  build:

    runs-on: macos-26

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up JDK
      uses: actions/setup-java@v6
      with:
        distribution: 'temurin'
        java-version: 21

    # The native module is Rust; rust-toolchain.toml pins the channel and the
    # aarch64/armv7 Android targets, so rustup installs them on first use.
    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android,armv7-linux-androideabi

    - name: Cache Rust build
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: app/src/main/native/rust -> target

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    # Cheap host-compiled checks first: the ABI layout assertions and the
    # config parser, so a broken port fails in seconds instead of after a full
    # NDK build.
    - name: Test the native module
      working-directory: app/src/main/native/rust
      run: |
        cargo fmt --check
        cargo clippy --all-targets -- -D warnings
        cargo test

    - name: Build with Gradle
      run: ./gradlew --warning-mode all assembleRelease

    - name: Label CI version when not a final release code
      run: |
        VERCODE=$(perl -n -e "print \$1 if /^versionCode=(.*)/" module/module.prop)
        if [ "$(echo $VERCODE | grep -o '.$')" -eq 1 ]; then
          perl -pi -e "s/^version=(.*)/version=\$1($VERCODE)-CI #${{ github.run_number }}/" module/module.prop
        fi

    - name: Upload CI module zip as artifact zip
      uses: actions/upload-artifact@v7
      with:
        name: GPhotosUnlimited-CI_#${{ github.run_number }}
        path: 'module/*'
        compression-level: 9
